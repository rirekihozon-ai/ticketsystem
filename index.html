<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参加申込・受付システム</title>
<style>
  :root{
    --bg:#f4f5f9; --card:#fff; --text:#1a1d29; --muted:#6b7280; --line:#e5e7eb;
    --accent:#4f46e5; --accent-dark:#4338ca; --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text); line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(800px 400px at 8% -8%, rgba(99,102,241,.18), transparent 60%),
      radial-gradient(700px 420px at 102% 0%, rgba(168,85,247,.14), transparent 60%);
  }
  .wrap{max-width:780px; margin:0 auto; padding:24px 16px 90px; position:relative; z-index:1;}
  .hero{text-align:center; padding:26px 0 22px}
  .hero-badge{display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.16em; color:var(--accent); background:#eef2ff; padding:6px 15px; border-radius:999px;}
  .hero h1{font-size:27px; margin:14px 0 6px; letter-spacing:-.02em; font-weight:800}
  .hero p{color:var(--muted); margin:0; font-size:13.5px}
  .tabs{display:flex; gap:6px; background:#fff; padding:6px; border-radius:15px; box-shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 22px -14px rgba(16,24,40,.3); margin-bottom:20px;}
  .tab{flex:1; border:0; background:transparent; padding:11px 8px; border-radius:10px; font:inherit; font-weight:700; font-size:14px; color:var(--muted); cursor:pointer; transition:.18s;}
  .tab:hover{background:#f7f8fc}
  .tab.active{background:var(--accent); color:#fff; box-shadow:0 6px 16px -6px rgba(79,70,229,.6)}
  .card{background:var(--card); border-radius:18px; padding:24px; box-shadow:0 1px 3px rgba(16,24,40,.06), 0 12px 30px -18px rgba(16,24,40,.35); margin-bottom:18px;}
  .card-title{font-size:17px; margin:0 0 18px; font-weight:800; letter-spacing:-.01em}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap}
  .card-head .card-title{margin:0}
  .field{margin-bottom:16px}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:6px; color:#374151}
  .req{font-size:10.5px; color:var(--danger); background:#fef2f2; padding:1px 7px; border-radius:5px; margin-left:6px; font-weight:800; vertical-align:middle}
  input[type=text],input[type=email],input[type=tel],input[type=password],textarea{width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:14px; background:#fafbfc; outline:none; transition:.15s; color:var(--text);}
  input:focus,textarea:focus{border-color:var(--accent); background:#fff; box-shadow:0 0 0 4px rgba(79,70,229,.1)}
  textarea{resize:vertical; min-height:78px}
  .err{color:var(--danger); font-size:12.5px; margin:6px 0 0; display:none; font-weight:600}
  .err.show{display:block}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .check{display:flex; align-items:center; gap:9px; font-size:13.5px; margin:6px 0 4px; cursor:pointer; color:#374151}
  .check input{width:18px; height:18px; accent-color:var(--accent); cursor:pointer}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1.5px solid var(--line); background:#fff; color:#374151; font:inherit; font-weight:700; font-size:14px; padding:11px 18px; border-radius:10px; cursor:pointer; transition:.16s; text-decoration:none;}
  .btn:hover{background:#f9fafb}
  .btn:disabled{opacity:.6; cursor:not-allowed}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 6px 16px -6px rgba(79,70,229,.6)}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn.block{width:100%; padding:14px; font-size:15px; margin-top:6px}
  .btn.sm{padding:6px 12px; font-size:12.5px; border-radius:8px}
  .ticket-head{text-align:center; padding-bottom:22px; border-bottom:1.5px dashed var(--line)}
  .ticket-head h2{font-size:19px; margin:0 0 6px; font-weight:800}
  .ticket-head p{margin:0; color:var(--muted); font-size:13px}
  .check-circle{width:58px; height:58px; border-radius:50%; margin:0 auto 14px; background:linear-gradient(135deg,#10b981,#059669); color:#fff; display:flex; align-items:center; justify-content:center; font-size:29px; box-shadow:0 10px 24px -8px rgba(16,185,129,.7);}
  #qrcode{display:flex; justify-content:center; padding:18px 0 6px}
  #qrcode svg{width:196px; height:196px; display:block}
  .ticket-no{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin:6px 0 22px}
  .ticket-no .label{font-size:12px; color:var(--muted); font-weight:700}
  .ticket-no .no{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:22px; font-weight:800; letter-spacing:.07em; color:var(--accent);}
  .info{margin:0}
  .info > div{display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid #f1f2f5; font-size:13.5px}
  .info > div:last-child{border-bottom:0}
  .info dt{color:var(--muted); flex-shrink:0; margin:0}
  .info dd{margin:0; text-align:right; font-weight:600; word-break:break-all}
  .ticket-actions{display:flex; gap:10px; margin-top:20px}
  .ticket-actions .btn{flex:1}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px}
  .stat{background:#f8f9fc; border:1px solid #eef0f5; border-radius:13px; padding:14px 8px; text-align:center}
  .stat .num{display:block; font-size:25px; font-weight:800; color:var(--accent); line-height:1.15}
  .stat .lbl{font-size:11.5px; color:var(--muted); font-weight:700}
  #reader{border-radius:14px; overflow:hidden; margin-bottom:12px; background:#0f1117}
  #reader:empty{display:none}
  .scan-actions{display:flex; gap:10px}
  .scan-actions .btn{flex:1}
  .manual{display:flex; gap:8px; margin-top:12px}
  .manual input{flex:1}
  .result{border-radius:14px; padding:16px 18px; margin-top:16px; border:1.5px solid; animation:pop .22s ease}
  @keyframes pop{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}
  .result.hidden{display:none}
  .result.ok{background:#ecfdf5; border-color:#a7f3d0}
  .result.warn{background:#fffbeb; border-color:#fde68a}
  .result.error{background:#fef2f2; border-color:#fecaca}
  .result-title{font-weight:800; font-size:16px; margin-bottom:8px}
  .result.ok .result-title{color:#047857}
  .result.warn .result-title{color:#b45309}
  .result.error .result-title{color:#b91c1c}
  .result-row{display:flex; justify-content:space-between; gap:14px; padding:6px 0; font-size:13.5px; border-bottom:1px solid rgba(0,0,0,.06)}
  .result-row:last-of-type{border-bottom:0}
  .result-row span{opacity:.72; flex-shrink:0}
  .result-row b{word-break:break-all; text-align:right}
  .result-line{font-size:13px; margin:9px 0 0}
  .table-wrap{overflow-x:auto; margin:0 -4px}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th{text-align:left; font-size:11px; letter-spacing:.06em; color:var(--muted); padding:8px 10px; border-bottom:1.5px solid #eef0f5; white-space:nowrap; font-weight:800;}
  td{padding:10px; border-bottom:1px solid #f4f5f8; vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .badge{display:inline-block; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .badge.on{background:#ecfdf5; color:#047857}
  .badge.off{background:#f3f4f6; color:#6b7280}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:700}
  .muted-sm{color:var(--muted); font-size:12.5px; white-space:nowrap}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:28px 0; margin:0}
  .hidden{display:none !important}
  .login-box{max-width:420px; margin:0 auto}
  .alert{background:#fef2f2; border:1.5px solid #fecaca; color:#b91c1c; padding:12px 16px; border-radius:10px; font-size:13px; margin-bottom:14px}
  .alert.hidden{display:none}
  .topbar{display:flex; justify-content:flex-end; margin-bottom:12px}
  .spinner{display:inline-block; width:16px; height:16px; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-3px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media print{
    body::before,.hero,.tabs,#view-register,#view-admin,.ticket-actions{display:none !important}
    .card{box-shadow:none; border:1px solid #ddd}
    .wrap{padding:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <span class="hero-badge">TECH CONFERENCE 2025</span>
    <h1>参加申込・受付システム</h1>
    <p>参加ご希望の方は「参加申込」タブから。受付スタッフの方は「主催者モード」をご利用ください。</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="register">参加申込</button>
    <button class="tab" data-view="admin">主催者モード</button>
  </nav>

  <main>
    <!-- 申込フォーム -->
    <section id="view-register" class="view">
      <div class="card">
        <h2 class="card-title">参加申込フォーム</h2>
        <form id="regForm" novalidate>
          <div class="field">
            <label for="name">お名前<span class="req">必須</span></label>
            <input id="name" type="text" placeholder="山田 太郎" autocomplete="name">
            <p class="err" id="err-name"></p>
          </div>
          <div class="field">
            <label for="email">メールアドレス<span class="req">必須</span></label>
            <input id="email" type="email" placeholder="taro@example.com" autocomplete="email">
            <p class="err" id="err-email"></p>
          </div>
          <div class="grid2">
            <div class="field">
              <label for="phone">電話番号</label>
              <input id="phone" type="tel" placeholder="090-1234-5678" autocomplete="tel">
            </div>
            <div class="field">
              <label for="org">所属・会社名</label>
              <input id="org" type="text" placeholder="株式会社サンプル">
            </div>
          </div>
          <div class="field">
            <label for="note">備考・ご要望</label>
            <textarea id="note" rows="3" placeholder="アレルギー、車椅子のご利用、その他ご要望など"></textarea>
          </div>
          <label class="check">
            <input type="checkbox" id="agree">
            <span>個人情報の取り扱いに同意します<span class="req">必須</span></span>
          </label>
          <p class="err" id="err-agree"></p>
          <p class="err" id="err-submit"></p>
          <button type="submit" class="btn primary block" id="submitBtn">申し込む</button>
        </form>
      </div>
    </section>

    <!-- 完了画面 -->
    <section id="view-complete" class="view hidden">
      <div class="card ticket">
        <div class="ticket-head">
          <div class="check-circle">✓</div>
          <h2>お申し込みが完了しました</h2>
          <p>当日は下記のQRコードを受付でご提示ください。</p>
        </div>
        <div id="qrcode"></div>
        <div class="ticket-no">
          <span class="label">予約番号</span>
          <span class="no" id="reserveNo">-</span>
          <button class="btn sm" id="copyBtn" type="button">コピー</button>
        </div>
        <dl class="info">
          <div><dt>お名前</dt><dd id="cName">-</dd></div>
          <div><dt>メールアドレス</dt><dd id="cEmail">-</dd></div>
          <div><dt>電話番号</dt><dd id="cPhone">-</dd></div>
          <div><dt>所属</dt><dd id="cOrg">-</dd></div>
          <div><dt>申込日時</dt><dd id="cCreated">-</dd></div>
        </dl>
        <div class="ticket-actions">
          <button class="btn" type="button" onclick="window.print()">印刷する</button>
          <button class="btn primary" type="button" id="newRegBtn">別の申込をする</button>
        </div>
      </div>
    </section>

    <!-- 主催者モード -->
    <section id="view-admin" class="view hidden">

      <!-- ログインフォーム -->
      <div class="card login-box" id="loginCard">
        <h2 class="card-title">主催者ログイン</h2>
        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">メールアドレス</label>
            <input id="loginEmail" type="email" autocomplete="username" placeholder="staff@example.com">
          </div>
          <div class="field">
            <label for="loginPass">パスワード</label>
            <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <p class="alert hidden" id="loginErr"></p>
          <button type="submit" class="btn primary block" id="loginBtn">ログイン</button>
        </form>
      </div>

      <!-- ログイン後の受付画面 -->
      <div id="adminPanel" class="hidden">
        <div class="topbar">
          <button class="btn sm" id="logoutBtn" type="button">ログアウト</button>
        </div>

        <div class="card">
          <h2 class="card-title">受付・入場処理</h2>
          <div class="stats">
            <div class="stat"><span class="num" id="statTotal">0</span><span class="lbl">予約数</span></div>
            <div class="stat"><span class="num" id="statIn">0</span><span class="lbl">入場済み</span></div>
            <div class="stat"><span class="num" id="statLeft">0</span><span class="lbl">未入場</span></div>
          </div>
          <div id="reader"></div>
          <div class="scan-actions">
            <button class="btn primary" id="scanBtn" type="button">カメラで読み取る</button>
            <button class="btn hidden" id="stopBtn" type="button">停止</button>
          </div>
          <div class="manual">
            <input id="manualInput" type="text" placeholder="予約番号を入力（例：EVT-AB12CD）" autocomplete="off">
            <button class="btn" id="manualBtn" type="button">照合</button>
          </div>
          <div id="result" class="result hidden"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">参加者一覧</h2>
            <button class="btn sm" id="csvBtn" type="button">CSV出力</button>
          </div>
          <div id="list"><p class="empty">読み込み中…</p></div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 外部ライブラリ（QRコード生成・カメラ読取） -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script type="module">
/* =========================================================
   ★★★ ここを書き換えてください ★★★
   Firebase コンソール → プロジェクト設定 → マイアプリ で取得した値
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCbW7rmxLtFAb2Sgj9W6tJCcEHfBQyhSJo",
  authDomain: "ticket-event-96272.firebaseapp.com",
  projectId: "ticket-event-96272",
  storageBucket: "ticket-event-96272.firebasestorage.app",
  messagingSenderId: "162587082406",
  appId: "1:162587082406:web:664dc7fc802c4b9c6f7e67"
};
/* ========================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc,
  collection, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);
const COL  = 'reservations';

/* =========================================================
   ユーティリティ
   ========================================================= */
const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

const ID_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function generateId() {
  let s = '';
  for (let i = 0; i < 6; i++) s += ID_CHARS.charAt(Math.floor(Math.random() * ID_CHARS.length));
  return 'EVT-' + s;
}

/* =========================================================
   タブ切り替え
   ========================================================= */
const VIEWS = ['register', 'complete', 'admin'];
function switchView(name) {
  VIEWS.forEach(v => $('view-' + v).classList.toggle('hidden', v !== name));
  const tabName = (name === 'complete') ? 'register' : name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === tabName));
  if (name !== 'admin' && isScanning) stopScan();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchView(tab.dataset.view));
});

/* =========================================================
   申込フォーム
   ========================================================= */
const form = $('regForm');
const submitBtn = $('submitBtn');

function setError(id, msg) {
  const el = $('err-' + id);
  if (el) { el.textContent = msg; el.classList.add('show'); }
}
function clearErrors() {
  document.querySelectorAll('.err').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
}
form.addEventListener('input', e => {
  const el = $('err-' + e.target.id);
  if (el) el.classList.remove('show');
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErrors();

  const name  = $('name').value.trim();
  const email = $('email').value.trim();
  const phone = $('phone').value.trim();
  const org   = $('org').value.trim();
  const note  = $('note').value.trim();
  const agree = $('agree').checked;

  let valid = true;
  if (!name) { setError('name', 'お名前を入力してください。'); valid = false; }
  if (!email) { setError('email', 'メールアドレスを入力してください。'); valid = false; }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('email', 'メールアドレスの形式が正しくありません。'); valid = false; }
  if (!agree) { setError('agree', '個人情報の取り扱いへの同意が必要です。'); valid = false; }

  if (!valid) return;

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>送信中…';

  try {
    const record = {
      name, email, phone, org, note,
      createdAt: new Date().toISOString(),
      checkedIn: false,
      checkedInAt: null
    };

    // 予約番号の重複を避けるため、最大5回リトライ
    let id = null;
    for (let attempt = 0; attempt < 5; attempt++) {
      const candidate = generateId();
      try {
        await setDoc(doc(db, COL, candidate), { ...record, id: candidate });
        id = candidate;
        break;
      } catch (err) {
        if (err.code === 'permission-denied') continue; // 重複 → リトライ
        throw err;
      }
    }
    if (!id) throw new Error('予約番号の生成に失敗しました。時間をおいて再度お試しください。');

    showTicket({ ...record, id });
    form.reset();
  } catch (err) {
    console.error(err);
    setError('submit', '送信に失敗しました：' + (err.message || err.code || '不明なエラー'));
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '申し込む';
  }
});

/* =========================================================
   チケット表示
   ========================================================= */
function showTicket(record) {
  const qrBox = $('qrcode');
  qrBox.innerHTML = '';
  try {
    const qr = qrcode(0, 'M');
    qr.addData(record.id);
    qr.make();
    qrBox.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 1, scalable: true });
  } catch (err) {
    qrBox.innerHTML = '<p class="empty">QRコードの生成に失敗しました。</p>';
  }
  $('reserveNo').textContent = record.id;
  $('cName').textContent  = record.name || '—';
  $('cEmail').textContent = record.email || '—';
  $('cPhone').textContent = record.phone || '—';
  $('cOrg').textContent   = record.org || '—';
  $('cCreated').textContent = formatDate(record.createdAt);
  switchView('complete');
}

$('copyBtn').addEventListener('click', async function () {
  const text = $('reserveNo').textContent;
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }
  const o = this.textContent;
  this.textContent = 'コピーしました';
  setTimeout(() => this.textContent = o, 1400);
});

$('newRegBtn').addEventListener('click', () => {
  clearErrors();
  switchView('register');
  $('name').focus();
});

/* =========================================================
   認証
   ========================================================= */
let currentUser = null;

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = $('loginErr');
  errEl.classList.add('hidden');
  const btn = $('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>ログイン中…';
  try {
    await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPass').value);
    $('loginPass').value = '';
  } catch (err) {
    const msg = ({
      'auth/invalid-credential': 'メールアドレスまたはパスワードが正しくありません。',
      'auth/invalid-email': 'メールアドレスの形式が正しくありません。',
      'auth/too-many-requests': '試行回数が多すぎます。しばらく待ってから再度お試しください。'
    })[err.code] || ('ログインに失敗しました：' + err.message);
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'ログイン';
  }
});

$('logoutBtn').addEventListener('click', () => signOut(auth));

let unsubscribe = null;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  const loggedIn = !!user;
  $('loginCard').classList.toggle('hidden', loggedIn);
  $('adminPanel').classList.toggle('hidden', !loggedIn);

  if (loggedIn) {
    startRealtimeListener();
  } else {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    if (isScanning) stopScan();
  }
});

/* =========================================================
   Firestore リアルタイム監視
   ========================================================= */
let reservations = [];

function startRealtimeListener() {
  if (unsubscribe) unsubscribe();
  const q = query(collection(db, COL), orderBy('createdAt', 'desc'));
  unsubscribe = onSnapshot(q, (snap) => {
    reservations = snap.docs.map(d => d.data());
    renderStats();
    renderList();
  }, (err) => {
    console.error('onSnapshot error', err);
  });
}

function renderStats() {
  const total = reservations.length;
  const checked = reservations.filter(r => r.checkedIn).length;
  $('statTotal').textContent = total;
  $('statIn').textContent = checked;
  $('statLeft').textContent = total - checked;
}

function renderList() {
  const el = $('list');
  if (!reservations.length) {
    el.innerHTML = '<p class="empty">まだ参加申込はありません。</p>';
    return;
  }
  el.innerHTML =
    '<div class="table-wrap"><table><thead><tr>' +
    '<th>予約番号</th><th>お名前</th><th>状態</th><th>入場時刻</th>' +
    '</tr></thead><tbody>' +
    reservations.map(r =>
      '<tr>' +
        '<td class="mono">' + escapeHtml(r.id) + '</td>' +
        '<td>' + escapeHtml(r.name) + '</td>' +
        '<td><span class="badge ' + (r.checkedIn ? 'on' : 'off') + '">' +
          (r.checkedIn ? '入場済み' : '未入場') + '</span></td>' +
        '<td class="muted-sm">' + (r.checkedInAt ? formatDate(r.checkedInAt) : '—') + '</td>' +
      '</tr>'
    ).join('') +
    '</tbody></table></div>';
}

/* =========================================================
   入場処理
   ========================================================= */
function beep(success) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = success ? 940 : 200;
    gain.gain.setValueAtTime(0.14, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch (e) {}
}

function showResult(kind, title, bodyHtml) {
  const el = $('result');
  el.className = 'result ' + kind;
  el.innerHTML =
    '<div class="result-title">' + escapeHtml(title) + '</div>' +
    '<div class="result-body">' + bodyHtml + '</div>' +
    '<button class="btn sm primary" type="button" id="againBtn" style="margin-top:14px">続けて読み取る</button>';
  el.classList.remove('hidden');
  el.querySelector('#againBtn')?.addEventListener('click', startScan);
}

async function handleCode(raw) {
  if (!currentUser) {
    showResult('error', 'ログインが必要です', '<p class="result-line">先に主催者ログインを済ませてください。</p>');
    return;
  }
  const code = String(raw || '').trim().toUpperCase();
  if (!code) {
    beep(false);
    showResult('error', '読み取りエラー', '<p class="result-line">コードが空です。</p>');
    return;
  }

  try {
    const ref = doc(db, COL, code);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      beep(false);
      showResult('error', '該当する予約が見つかりません',
        '<div class="result-row"><span>読み取った内容</span><b class="mono">' + escapeHtml(code) + '</b></div>' +
        '<p class="result-line">このイベントの予約番号ではない可能性があります。</p>');
      return;
    }

    const data = snap.data();

    if (data.checkedIn) {
      beep(false);
      showResult('warn', '⚠ 既に入場済みです',
        '<div class="result-row"><span>予約番号</span><b class="mono">' + escapeHtml(data.id) + '</b></div>' +
        '<div class="result-row"><span>お名前</span><b>' + escapeHtml(data.name) + '</b></div>' +
        '<div class="result-row"><span>入場時刻</span><b>' + formatDate(data.checkedInAt) + '</b></div>' +
        '<p class="result-line">二重入場にならないようご注意ください。</p>');
      return;
    }

    const now = new Date().toISOString();
    await updateDoc(ref, { checkedIn: true, checkedInAt: now });

    beep(true);
    showResult('ok', '✓ 入場OK',
      '<div class="result-row"><span>予約番号</span><b class="mono">' + escapeHtml(data.id) + '</b></div>' +
      '<div class="result-row"><span>お名前</span><b>' + escapeHtml(data.name) + '</b></div>' +
      (data.org ? '<div class="result-row"><span>所属</span><b>' + escapeHtml(data.org) + '</b></div>' : '') +
      '<div class="result-row"><span>入場時刻</span><b>' + formatDate(now) + '</b></div>');
  } catch (err) {
    console.error(err);
    beep(false);
    showResult('error', '処理に失敗しました',
      '<p class="result-line">' + escapeHtml(err.message || String(err)) + '</p>' +
      '<p class="result-line">通信環境とログイン状態をご確認ください。</p>');
  }
}

/* =========================================================
   カメラスキャン
   ========================================================= */
let qrScanner = null;
let isScanning = false;
const scanBtn = $('scanBtn');
const stopBtn = $('stopBtn');

async function startScan() {
  if (isScanning) return;
  if (typeof Html5Qrcode === 'undefined') {
    showResult('error', '読み取り機能を利用できません', '<p class="result-line">ライブラリの読み込みに失敗しました。</p>');
    return;
  }
  $('result').classList.add('hidden');
  scanBtn.disabled = true;
  scanBtn.textContent = 'カメラ起動中…';

  try {
    if (!qrScanner) qrScanner = new Html5Qrcode('reader', { verbose: false });
    await qrScanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: (w, h) => {
          const edge = Math.floor(Math.min(w, h) * 0.7);
          const size = Math.max(50, edge);
          return { width: size, height: size };
        }
      },
      async (decodedText) => {
        if (!isScanning) return;
        await stopScan();
        handleCode(decodedText);
      },
      () => {}
    );
    isScanning = true;
    scanBtn.textContent = '読み取り中…';
    stopBtn.classList.remove('hidden');
  } catch (err) {
    scanBtn.disabled = false;
    scanBtn.textContent = 'カメラで読み取る';
    showResult('error', 'カメラを起動できませんでした',
      '<p class="result-line">' + escapeHtml(err.message || String(err)) + '</p>' +
      '<p class="result-line">カメラ許可・HTTPSをご確認ください。下の入力欄から手動照合も可能です。</p>');
  }
}

async function stopScan() {
  if (!qrScanner || !isScanning) return;
  try { await qrScanner.stop(); } catch (e) {}
  isScanning = false;
  scanBtn.disabled = false;
  scanBtn.textContent = 'カメラで読み取る';
  stopBtn.classList.add('hidden');
}

scanBtn.addEventListener('click', startScan);
stopBtn.addEventListener('click', stopScan);

/* =========================================================
   手動入力
   ========================================================= */
function submitManual() {
  const input = $('manualInput');
  const v = input.value.trim();
  if (!v) { input.focus(); return; }
  handleCode(v);
  input.value = '';
}
$('manualBtn').addEventListener('click', submitManual);
$('manualInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); submitManual(); }
});

/* =========================================================
   CSV 出力
   ========================================================= */
const csvCell = (v) => {
  const s = String(v ?? '');
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};

$('csvBtn').addEventListener('click', () => {
  if (!reservations.length) { alert('出力できる参加者がいません。'); return; }
  const header = ['予約番号','お名前','メールアドレス','電話番号','所属','備考','申込日時','入場状況','入場日時'];
  const lines = [header.map(csvCell).join(',')];
  reservations.slice().reverse().forEach(r => {
    lines.push([r.id, r.name, r.email, r.phone, r.org, r.note,
      formatDate(r.createdAt),
      r.checkedIn ? '入場済み' : '未入場',
      r.checkedInAt ? formatDate(r.checkedInAt) : ''
    ].map(csvCell).join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '参加者一覧_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
